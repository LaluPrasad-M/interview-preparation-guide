name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No merge conflict markers
        run: |
          if grep -rnE '^(<<<<<<<|>>>>>>>) ' --include='*.md' .; then
            echo "::error::merge conflict markers left in notes"
            exit 1
          fi
